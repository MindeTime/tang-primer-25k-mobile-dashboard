<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123c52">
<title>ورود | داشبورد پروژه موبایل Tang Primer 25K</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#eaf1f4,#dce8ed);font-family:Tahoma,Arial,sans-serif;color:#172b35}.panel{width:min(100%,420px);background:#fff;border:1px solid #d9e3e8;border-radius:20px;padding:30px;box-shadow:0 18px 50px #123c5218;text-align:center}.mark{width:58px;height:58px;margin:0 auto 15px;border-radius:17px;background:#123c52;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:bold}h1{font-size:1.35rem;margin:0 0 8px;color:#123c52}.sub{color:#617680;font-size:.9rem;margin:0 0 23px}label{display:block;text-align:right;font-size:.9rem;margin-bottom:8px}input{width:100%;padding:13px 14px;border:1px solid #cbd9df;border-radius:10px;font:inherit;direction:ltr;text-align:left;outline:none}input:focus{border-color:#28718d;box-shadow:0 0 0 3px #28718d20}button{width:100%;margin-top:15px;border:0;border-radius:10px;padding:13px;background:#123c52;color:white;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#login-error{min-height:25px;color:#b42318;font-size:.85rem;margin:10px 0 0}.foot{font-size:.75rem;color:#81919a;margin-top:20px}
</style>
<script src="auth.js"></script>
</head>
<body>
<main class="panel">
<div class="mark">T</div>
<h1>داشبورد پروژه موبایل</h1>
<p class="sub">Tang Primer 25K — برای ورود، رمز عبور را وارد کنید.</p>
<form id="login-form" autocomplete="on">
<label for="site-password">رمز عبور</label>
<input id="site-password" type="password" autocomplete="current-password" required autofocus placeholder="رمز عبور را وارد کنید">
<button type="submit">ورود به سایت</button>
<p id="login-error" role="alert" aria-live="polite"></p>
</form>
<div class="foot">دسترسی به صفحات سایت در این مرورگر تا پایان نشست فعال می‌ماند.</div>
</main>
</body>
</html>
