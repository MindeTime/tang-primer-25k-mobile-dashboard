<!doctype html>

<head>
<meta charset="utf-8">

<title>ورود | داشبورد پروژه موبایل</title>
<style>
*{box-sizing:border-box}
:root{--navy:#102f43;--blue:#17627d;--ink:#183342;--muted:#70838d}
body{margin:0;min-height:100vh;padding:34px 22px;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(ellipse at 12% 12%,#d5e9ef 0,transparent 34%),radial-gradient(ellipse at 88% 85%,#d4e4ec 0,transparent 34%),linear-gradient(135deg,#f5f8fa,#e6eef2);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
.scene{width:min(1120px,100%);display:grid;grid-template-columns:1fr 390px 1fr;grid-template-rows:auto auto;align-items:center;gap:22px;position:relative}
.login{grid-column:2;grid-row:1/3;position:relative;z-index:2;background:#ffffffed;border:1px solid #fff;border-radius:26px;padding:34px 30px;box-shadow:0 24px 70px #17394b24,0 4px 14px #17394b0d;text-align:center;backdrop-filter:blur(12px)}
.mark{width:58px;height:58px;margin:0 auto 17px;border-radius:18px;background:linear-gradient(145deg,#1c718e,#102f43);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:bold;box-shadow:0 8px 20px #17627d35}
h1{font-size:1.42rem;margin:0 0 10px;color:var(--navy)}
.sub{color:var(--muted);font-size:.91rem;line-height:1.9;margin:0 0 26px}
label{display:block;text-align:right;font-size:.9rem;margin-bottom:9px;font-weight:bold;color:#294958}
input{width:100%;padding:14px;border:1px solid #cbd9df;border-radius:12px;background:#fbfdfe;font:inherit;direction:ltr;text-align:left;outline:none;transition:.2s}
input:focus{border-color:#28718d;box-shadow:0 0 0 4px #28718d18;background:#fff}
button{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;background:linear-gradient(110deg,#17627d,#102f43);color:white;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 8px 18px #123c5228;transition:transform .2s,filter .2s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:disabled{opacity:.65;cursor:wait}
#login-error{min-height:25px;color:#b42318;font-size:.85rem;margin:10px 0 0}
.foot{font-size:.73rem;color:#8798a1;margin-top:19px;line-height:1.8}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center}
.gallery.left{grid-column:1;grid-row:1/3}
.gallery.right{grid-column:3;grid-row:1/3}
.photo{margin:0;min-width:0;padding:9px;background:#ffffffc9;border:1px solid #fff;border-radius:17px;box-shadow:0 12px 30px #16394b16;transform:rotate(var(--tilt,0deg));transition:transform .25s,box-shadow .25s}
.photo:hover{transform:translateY(-5px) rotate(0);box-shadow:0 18px 34px #16394b25}
/* Gentle floating animation for component photos */
.photo{animation:photoFloat 6s ease-in-out infinite;will-change:translate}
.gallery.left .photo:nth-child(2){animation-delay:-1.4s}
.gallery.left .photo:nth-child(3){animation-delay:-3.1s}
.gallery.right .photo:nth-child(1){animation-delay:-2.2s}
.gallery.right .photo:nth-child(2){animation-delay:-4s}
.gallery.right .photo:nth-child(3){animation-delay:-.8s}
@keyframes photoFloat{0%,100%{translate:0 0}50%{translate:0 -9px}}
.photo:hover{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.photo{animation:none;will-change:auto;transition:none}.photo:hover{transform:none}}
.photo img{display:block;width:100%;height:116px;object-fit:contain;background:#f4f7f8;border-radius:10px}
.photo figcaption{font-size:.72rem;color:#45616e;text-align:center;padding:9px 2px 2px;font-weight:bold}
.photo.wide{grid-column:span 2}
.photo.wide img{height:150px}
.gallery.left .photo:nth-child(odd){--tilt:-2deg}.gallery.left .photo:nth-child(even){--tilt:2deg}
.gallery.right .photo:nth-child(odd){--tilt:2deg}.gallery.right .photo:nth-child(even){--tilt:-2deg}
@media(max-width:850px){.scene{max-width:650px;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:16px}.login{grid-column:1/3;grid-row:1;padding:30px 26px}.gallery.left{grid-column:1;grid-row:2}.gallery.right{grid-column:2;grid-row:2}.photo img{height:100px}.photo.wide img{height:115px}}
@media(max-width:480px){body{padding:20px 13px}.scene{gap:12px}.login{padding:27px 20px;border-radius:21px}.gallery{gap:9px}.photo{padding:6px;border-radius:13px}.photo img{height:78px}.photo.wide img{height:95px}.photo figcaption{font-size:.65rem;padding-top:7px}h1{font-size:1.25rem}}
/* Dark login theme */
:root{color-scheme:dark;--navy:#d9edf7;--blue:#55b8d7;--ink:#e5edf4;--muted:#a5b5c2}body{background:#0b121a!important;background-image:none!important;color:#e5edf4!important}.login{background:#142231ed!important;border:1px solid #31485b!important;box-shadow:0 24px 70px #0008,0 4px 14px #0005!important}h1{color:#e5f3fa!important}.sub{color:#a5b8c6!important}label{color:#d1e2ec!important}input{background:#0c1722!important;color:#f2f7fa!important;border-color:#3b5367!important}input:focus{background:#101e2b!important}.gallery-card,.device-card{background:#142231!important;border-color:#31485b!important;color:#e5edf4!important}
</style>
<script src="auth.js?v=20261107-2"></script>
<style id="forced-dark-theme">
:root{color-scheme:dark!important;--site-background:#0b121a!important;--site-on-background:#e6edf3!important;--site-primary:#12384d!important;--site-on-primary:#f4f8fb!important;--site-secondary:#1b303d!important;--site-on-secondary:#e2edf3!important}
html,body{background:#0b121a!important;color:#e6edf3!important}body{background-image:none!important}
#app,main,.page,.container,.content,.wrap{background-color:#0b121a!important;color:#e6edf3!important}
header,nav,section,article,aside,footer,.card,.panel,.box,.tile,.item,.stat,.login,.photo,.gallery,.table-wrap,.scene,.feature,.module,.part-card{background-color:#111e29!important;color:#e6edf3!important;border-color:#2b4353!important}
.hero{background:#12384d!important;color:#f4f8fb!important}
h1,h2,h3,h4,h5,h6,p,li,label,td,th,small,strong,span,figcaption,caption{color:#e6edf3}
a{color:#70c8ee!important}button,.button,input[type=submit]{background:#17627d!important;color:#fff!important;border-color:#347d99!important}
input,textarea,select{background:#0b1721!important;color:#e6edf3!important;border:1px solid #385366!important}
input::placeholder,textarea::placeholder{color:#91a6b5!important}
table{background:#111e29!important;color:#e6edf3!important;border-color:#2b4353!important}th{background:#1b303d!important}
td,th{border-color:#2b4353!important}hr{border-color:#2b4353!important}
.login{background:#111e29!important;border:2px solid #35b8d8!important;box-shadow:0 0 0 4px #35b8d81c,0 0 24px #35b8d84d,0 24px 70px #0008!important}
.mark{background:linear-gradient(145deg,#1c718e,#102f43)!important}.sub,.muted,.hint,.note{color:#a9bbc7!important}

/* Animated starfield background */
#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scene{z-index:1}
@media(prefers-reduced-motion:reduce){#starfield{display:none}}

<style id="uniform-starfield-layout">
/* One continuous background; separate only the login and photo frames */
html,body{background:#0b121a!important;background-image:none!important}
.login{background:transparent!important;border:1px solid #35b8d8!important;box-shadow:none!important;backdrop-filter:none!important}
.photo{background:transparent!important;border:1px solid #345064!important;box-shadow:none!important}
.photo img{background:transparent!important}
.gallery{background:transparent!important}
</style>
</style>
</head>
<body>

<canvas id="starfield" aria-hidden="true"></canvas>
<script>
(()=>{
 const canvas=document.getElementById('starfield');
 if(!canvas || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
 const ctx=canvas.getContext('2d');
 let w=0,h=0,stars=[],raf=0;
 function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  w=window.innerWidth;h=window.innerHeight;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const count=Math.min(190,Math.max(70,Math.round(w*h/8500)));
  stars=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,r:.35+Math.random()*1.35,a:.2+Math.random()*.65,s:.003+Math.random()*.009,phase:Math.random()*Math.PI*2,dx:(Math.random()-.5)*.09}));
 }
 function draw(t){
  ctx.clearRect(0,0,w,h);
  for(const p of stars){
   const alpha=p.a*(.62+.38*Math.sin(t*p.s+p.phase));
   ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
   ctx.fillStyle='rgba(177,225,255,'+alpha+')';ctx.shadowBlur=p.r>1?9:4;ctx.shadowColor='#65cfff';ctx.fill();
   p.x+=p.dx;p.y-=.025;
   if(p.x<-3)p.x=w+3;if(p.x>w+3)p.x=-3;if(p.y<-3)p.y=h+3;
  }
  ctx.shadowBlur=0;
  raf=requestAnimationFrame(draw);
 }
 resize();window.addEventListener('resize',resize,{passive:true});raf=requestAnimationFrame(draw);
 window.addEventListener('pagehide',()=>cancelAnimationFrame(raf),{once:true});
})();
</script>
